<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover para que el layout llegue hasta los bordes en pantallas con notch;
         maximum-scale queda libre a propósito: limitar el zoom rompe la accesibilidad. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <!-- Sin esto, agregar la app a la pantalla de inicio en iOS abre Safari con toda su barra
         en vez de una ventana propia, y el DT pierde alto de pantalla al costado de la cancha. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Overtime DT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- El nombre del meta era "Overtime-DT", que no es ningún meta que el navegador entienda:
         la descripción real de la página quedaba vacía. -->
    <meta
      name="description"
      content="Panel de entrenadores y directores técnicos de Overtime Dodgeball."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Overtime DT</title>
  <meta property="og:title" content="Overtime DT" />
  <meta property="og:description" content="Panel de Entrenadores y Directores Técnicos." />
  <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
